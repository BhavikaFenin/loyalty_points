<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Rewards</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <h2>☕ Café Rewards</h2>
    <p>Management System</p>

    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('members')">Members</button>
    <button onclick="showSection('purchase')">Purchase</button>
    <button onclick="showSection('redeem')">Redeem Rewards</button>
    <button onclick="showSection('transactions')">Transactions</button>
</div>

<div class="main">
    <header>
        <h1>Café Loyalty System</h1>
        <input id="globalSearch" placeholder="Search by phone..." oninput="globalSearchMember()">
    </header>

    <div id="message"></div>

    <section id="dashboard" class="section">
        <h2>Dashboard</h2>

        <div class="cards">
            <div class="card">
                <h3>Total Members</h3>
                <strong id="totalMembers">0</strong>
            </div>

            <div class="card">
                <h3>Total Points</h3>
                <strong id="totalPoints">0</strong>
            </div>

            <div class="card">
                <h3>Gold Members</h3>
                <strong id="goldMembers">0</strong>
            </div>

            <div class="card">
                <h3>Points Redeemed</h3>
                <strong id="pointsRedeemed">0</strong>
            </div>
        </div>
    </section>

    <section id="members" class="section hidden">
        <h2>Members</h2>

        <div class="box">
            <h3>Add New Member</h3>

            <input id="memberName" placeholder="Member name">
            <input id="memberPhone" placeholder="10-digit phone">
            <button onclick="addMember()">Add Member</button>
        </div>

        <div class="box">
            <h3>Find Member</h3>

            <input id="searchPhone" placeholder="Phone number">
            <button onclick="searchMember()">Search</button>

            <div id="searchResult"></div>
        </div>

        <div id="memberList"></div>
    </section>

    <section id="purchase" class="section hidden">
        <h2>Record Purchase</h2>

        <div class="box">
            <input id="purchasePhone" placeholder="Member phone">
            <input id="purchaseAmount" type="number" placeholder="Purchase amount">
            <button onclick="recordPurchase()">Record Purchase</button>
        </div>
    </section>

    <section id="redeem" class="section hidden">
        <h2>Redeem Rewards</h2>

        <div class="box">
            <input id="redeemPhone" placeholder="Member phone">
            <input id="redeemPoints" type="number" placeholder="Points">
            <button onclick="redeemPoints()">Redeem</button>
        </div>
    </section>

    <section id="transactions" class="section hidden">
        <h2>Transactions</h2>
        <div id="transactionList"></div>
    </section>
</div>

<script src="js/script.js"></script>
</body>
</html>
